# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Dummy / Template configuration for GitHub — replace placeholder values before deploying

client_id = "YOUR_SHOPIFY_CLIENT_ID"
application_url = "https://your-app-domain.example.com"
embedded = true
name = "Socialvire"
handle = "socialvire-template"

[build]
automatically_update_urls_on_dev = true
dev_store_url = "your-dev-store.myshopify.com"

[app_proxy]
url = "https://your-app-domain.example.com/shopify/proxy"
subpath = "socialvire"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_app_proxy,read_themes,write_app_proxy,write_content,write_online_store_pages,write_themes"
optional_scopes = []
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://your-app-domain.example.com/shopify/callback",
  "https://your-app-domain.example.com/callback"
]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/shopify/webhooks"