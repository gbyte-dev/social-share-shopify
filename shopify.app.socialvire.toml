# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "635bfb45a21668c84eee87c87f9509a2"
application_url = "https://socialvire.webvire.com"
embedded = true
name = "Socialvire"
handle = "socialvire"

[app_proxy]
url = "https://socialvire.webvire.com/shopify/proxy"
subpath = "socialvire"
prefix = "apps"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_app_proxy,read_themes,write_app_proxy,write_content,write_online_store_pages,write_themes"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://socialvire.webvire.com/shopify/callback",
  "https://socialvire.webvire.com/callback"
]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/shopify/webhooks"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/shopify/webhooks"
